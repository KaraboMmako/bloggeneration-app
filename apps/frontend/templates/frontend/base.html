{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="{% static 'frontend/image/bloggen-fav.png' %}" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'frontend/css/style.css' %}">

    <title>{% block title %}BlogGen{% endblock %}</title>
</head>
<body>

    <nav class="app-navbar navbar navbar-expand-lg navbar-light bg-white">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% if user.is_authenticated %}{% url 'frontend:dashboard' %}{% else %}{% url 'frontend:login' %}{% endif %}">
                <img class="logo-img" src="{% static 'frontend/image/bloggen-icon.png' %}" alt="BlogGen Logo">
                <strong>BlogGen</strong>
            </a>

            {% if user.is_authenticated %}
                <div class="profile-menu">
                    <button class="profile-avatar" id="profile-avatar-btn" type="button" aria-expanded="false">
                        {{ user.email|first|upper }}
                    </button>

                    <div class="profile-dropdown" id="profile-dropdown">
                        <div class="profile-dropdown-header">
                            <span class="profile-dropdown-email">{{ user.email }}</span>
                        </div>
                        <div class="profile-dropdown-divider"></div>
                        <a href="{% url 'frontend:change_password' %}" class="profile-dropdown-item">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            Change Password
                        </a>
                        <a href="{% url 'frontend:logout' %}" class="profile-dropdown-item profile-dropdown-logout">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                            Logout
                        </a>
                    </div>
                </div>
            {% endif %}
        </div>
    </nav>

    <main class="{% block main_class %}app-main{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'frontend/js/app.js' %}"></script>
</body>
</html>
